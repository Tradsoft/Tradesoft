name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-core:
    name: Build & Test Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Core solution
        run: dotnet restore TradeSoft/TradeSoft.Core.sln

      - name: Build Core solution
        run: dotnet build TradeSoft/TradeSoft.Core.sln -c Release --no-restore

      - name: Test Core solution
        run: dotnet test TradeSoft/TradeSoft.Core.sln -c Release --no-build
