name: CI

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Test (all solutions)
        run: |
          set -e
          for sln in $(find . -name '*.sln'); do
            echo "==> $sln"
            dotnet restore "$sln"
            dotnet build "$sln" -c Release --no-restore
            dotnet test "$sln" -c Release --no-build
          done
